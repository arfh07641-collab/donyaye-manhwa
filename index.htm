











<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مانهوا لند</title>
<style>
body {
  margin: 0;
  background: #071525;
  color: #effaff;
  font-family: Tahoma, sans-serif;
}
header {
  padding: 22px;
  text-align: center;
  background: #102943;
  border-bottom: 1px solid #55aee0;
}
h1, h2 { color: #bcecff; }
main { width: 92%; max-width: 1000px; margin: auto; }
button, input, textarea {
  font: inherit;
  padding: 11px;
  border-radius: 9px;
}
button {
  background: #bcecff;
  border: 0;
  cursor: pointer;
  color: #071525;
  margin: 5px;
}
input, textarea {
  width: 100%;
  box-sizing: border-box;
  background: #091b2d;
  color: white;
  border: 1px solid #37617f;
  margin: 6px 0 12px;
}
.panel {
  background: #102943;
  border: 1px solid #37617f;
  border-radius: 14px;
  padding: 18px;
  margin: 22px 0;
}
.library {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(145px,1fr));
  gap: 15px;
}
.card {
  background: #102943;
  padding: 12px;
  border-radius: 12px;
  overflow: hidden;
}
.card img {
  width: 100%;
  height: 190px;
  object-fit: cover;
  border-radius: 8px;
}
.page {
  display: block;
  width: 100%;
  height: auto;
}
.hidden { display: none; }
</style>
</head>
<body>

<header>
  <h1>❄️ مانهوا لند ❄️</h1>
  <p>دنیایی برای خواندن مانهوا</p>
  <button onclick="showLibrary()">کتابخانه</button>
  <button onclick="showAdmin()">پنل مدیر</button>
</header>

<main>
  <section id="libraryView">
    <h2>📚 کتابخانهٔ مانهواها</h2>
    <input id="search" placeholder="جست‌وجوی مانهوا..." oninput="renderLibrary()">
    <div id="library" class="library"></div>
  </section>

  <section id="adminView" class="hidden">
    <div class="panel">
      <h2>➕ اضافه کردن مانهوا</h2>
      <label>نام مانهوا</label>
      <input id="title" placeholder="نام مانهوا">

      <label>آدرس تصویر کاور</label>
      <input id="cover" placeholder="https://...">

      <label>خلاصهٔ داستان</label>
      <textarea id="summary" placeholder="خلاصهٔ داستان"></textarea>

      <button onclick="addManhwa()">ثبت مانهوا</button>
    </div>

    <div class="panel">
      <h2>📖 اضافه کردن چپتر</h2>
      <label>شمارهٔ مانهوا (از فهرست زیر)</label>
      <input id="manhwaId" type="number" min="1" placeholder="مثلاً 1">

      <label>شمارهٔ چپتر</label>
      <input id="chapterNumber" type="number" min="1" placeholder="مثلاً 1">

      <label>آدرس عکس‌های صفحات، هر آدرس در یک خط</label>
      <textarea id="pages" rows="6" placeholder="https://example.com/page1.jpg&#10;https://example.com/page2.jpg"></textarea>

      <p>حداکثر مجاز: ۱۲۰ صفحه برای هر چپتر</p>
      <button onclick="addChapter()">ثبت چپتر</button>
    </div>
  </section>

  <section id="detailView" class="hidden">
    <button onclick="showLibrary()">← برگشت به کتابخانه</button>
    <div id="detail"></div>
  </section>

  <section id="readerView" class="hidden">
    <button onclick="backToDetail()">← برگشت به چپترها</button>
    <div id="reader"></div>
  </section>
</main>

<script>
let manhwas = JSON.parse(localStorage.getItem("manhwaDemo") || "[]");
let selectedId = null;

function save() {
  localStorage.setItem("manhwaDemo", JSON.stringify(manhwas));
}

function hideViews() {
  ["libraryView","adminView","detailView","readerView"]
    .forEach(id => document.getElementById(id).classList.add("hidden"));
}

function showLibrary() {
  hideViews();
  document.getElementById("libraryView").classList.remove("hidden");
  renderLibrary();
}

function showAdmin() {
  hideViews();
  document.getElementById("adminView").classList.remove("hidden");
}

function addManhwa() {
  const title = document.getElementById("title").value.trim();
  const cover = document.getElementById("cover").value.trim();
  const summary = document.getElementById("summary").value.trim();

  if (!title) return alert("نام مانهوا را بنویس!");

  manhwas.push({
    id: Date.now(),
    title, cover, summary, chapters: []
  });

  save();
  document.getElementById("title").value = "";
  document.getElementById("cover").value = "";
  document.getElementById("summary").value = "";
  alert("مانهوا در این مرورگر ثبت شد.");
  showLibrary();
}

function addChapter() {
  const idNumber = Number(document.getElementById("manhwaId").value);
  const number = Number(document.getElementById("chapterNumber").value);
  const pages = document.getElementById("pages").value
    .split("\n").map(x => x.trim()).filter(Boolean);

  const m = manhwas[idNumber - 1];

  if (!m) return alert("شمارهٔ مانهوا درست نیست.");
  if (!number || number < 1) return alert("شمارهٔ چپتر را وارد کن.");
  if (!pages.length) return alert("آدرس صفحه‌ها را وارد کن.");
  if (pages.length > 120) return alert("حداکثر ۱۲۰ صفحه مجاز است.");
  if (m.chapters.some(c => c.number === number))
    return alert("این چپتر قبلاً ثبت شده است.");

  m.chapters.push({number, pages});
  m.chapters.sort((a,b) => a.number - b.number);
  save();
  alert("چپتر ثبت شد.");
  showLibrary();
}

function renderLibrary() {
  const q = document.getElementById("search").value.toLowerCase();
  const list = manhwas.filter(m => m.title.toLowerCase().includes(q));
  document.getElementById("library").innerHTML = list.length
    ? list.map(m => `
      <div class="card">
        ${m.cover ? `<img src="${safe(m.cover)}" alt="">` : "❄️"}
        <h3>${safe(m.title)}</h3>
        <p>${safe(m.summary || "")}</p>
        <button onclick="openDetail(${m.id})">دیدن مانهوا</button>
      </div>`).join("")
    : "<p>هنوز مانهوا‌ای اضافه نشده است.</p>";
}

function safe(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function openDetail(id) {
  selectedId = id;
  const m = manhwas.find(x => x.id === id);
  if (!m) return showLibrary();
  hideViews();
  document.getElementById("detailView").classList.remove("hidden");
  document.getElementById("detail").innerHTML = `
    <h2>${safe(m.title)}</h2>
    <p>${safe(m.summary || "")}</p>
    <h3>چپترها</h3>
    ${m.chapters.length ? m.chapters.map(c =>
      `<p>چپتر ${c.number} — ${c.pages.length} صفحه
      <button onclick="openReader(${c.number})">مطالعه آنلاین</button></p>`
    ).join("") : "<p>هنوز چپتری ثبت نشده.</p>"}`;
}

function openReader(number) {
  const m = manhwas.find(x => x.id === selectedId);
  const c = m?.chapters.find(x => x.number === number);
  if (!c) return;
  hideViews();
  document.getElementById("readerView").classList.remove("hidden");
  document.getElementById("reader").innerHTML =
    `<h2>${safe(m.title)} — چپتر ${c.number}</h2>` +
    c.pages.map((p,i) =>
      `<img class="page" loading="lazy" src="${safe(p)}" alt="صفحه ${i+1}">`
    ).join("");
}

function backToDetail() { openDetail(selectedId); }

showLibrary();
</script>
</body>
</html>
