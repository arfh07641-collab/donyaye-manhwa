






<style>
/* شروع سینمایی مانهوا لند */
#intro {
  position: fixed;
  inset: 0;
  z-index: 100;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #030916;
  color: #f4fbff;
  transition: opacity 1.8s ease, visibility 1.8s ease;
}
#intro.leaving {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
#intro .night-glow {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 75% 35%, #183b62 0%, transparent 40%),
    radial-gradient(ellipse at 50% 100%, #102b4a 0%, transparent 50%),
    linear-gradient(180deg, #020610 0%, #08172b 65%, #10243b 100%);
  opacity: 0;
  animation: nightReveal 4s ease forwards;
}
#intro .moon {
  position: absolute;
  width: 115px;
  height: 115px;
  border-radius: 50%;
  top: 12%;
  right: 17%;
  background: #e9f7ff;
  box-shadow: 0 0 30px #b9e9ff, 0 0 100px #55aee077;
  opacity: 0;
  animation: moonRise 3s 2s ease forwards;
}
#intro .castle {
  position: absolute;
  inset: auto 0 0;
  width: 100%;
  height: 54%;
  object-fit: cover;
  object-position: center;
  opacity: 0;
  filter: brightness(.45) saturate(.7);
  animation: castleAppear 4s 1.5s ease forwards;
}
#intro .snow-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
#intro .intro-content {
  position: relative;
  z-index: 3;
  width: min(850px, 92%);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 22px;
  min-height: 75vh;
  text-align: center;
}
#intro .hana-frame {
  width: min(42%, 310px);
  align-self: flex-end;
  opacity: 0;
  transform: translateY(35px);
  animation: hanaAppear 2s 4.5s ease forwards;
}
#intro .hana-frame video {
  display: block;
  width: 100%;
  max-height: 58vh;
  object-fit: contain;
  background: transparent;
  border: 0;
  border-radius: 18px;
  box-shadow: 0 0 35px #8bd9ff20;
}
#intro .welcome {
  flex: 1;
  opacity: 0;
  transform: translateY(12px);
  animation: subtitleAppear 1.4s 6s ease forwards;
}
#intro .brand {
  font-size: clamp(24px, 5vw, 45px);
  letter-spacing: 4px;
  color: #e8f8ff;
  text-shadow: 0 0 25px #70caff88;
}
#intro .subtitle {
  display: inline-block;
  margin-top: 15px;
  padding: 12px 18px;
  border-radius: 12px;
  background: #020916bb;
  border: 1px solid #b9e9ff55;
  font-size: clamp(14px, 2.5vw, 20px);
  line-height: 2;
}
#intro .palace-button {
  display: block;
  margin: 25px auto 0;
  padding: 14px 27px;
  color: #061426;
  background: linear-gradient(135deg, #f5fcff, #a9e3ff);
  border: 1px solid white;
  border-radius: 30px;
  box-shadow: 0 0 25px #75cfff44;
  opacity: 0;
  animation: buttonAppear 1.5s 8s ease forwards;
}
#intro .palace-button:hover {
  box-shadow: 0 0 35px #a9e3ff99;
  transform: translateY(-2px);
}
#intro .skip-intro {
  position: absolute;
  z-index: 5;
  left: 15px;
  bottom: 15px;
  background: #071426cc;
  border: 1px solid #b9e9ff66;
  color: #eaf8ff;
  font-size: 12px;
}
@keyframes nightReveal {
  to { opacity: 1; }
}
@keyframes moonRise {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: .9; transform: translateY(0); }
}
@keyframes castleAppear {
  to { opacity: .8; }
}
@keyframes hanaAppear {
  to { opacity: 1; transform: translateY(0); }
}
@keyframes subtitleAppear {
  to { opacity: 1; transform: translateY(0); }
}
@keyframes buttonAppear {
  to { opacity: 1; }
}
@media(max-width:600px) {
  #intro .intro-content {
    flex-direction: column-reverse;
    gap: 8px;
    min-height: 90vh;
  }
  #intro .hana-frame {
    width: min(55%, 220px);
    max-height: 37vh;
  }
  #intro .hana-frame video { max-height: 37vh; }
  #intro .welcome { flex: 0; }
  #intro .moon { width: 75px; height: 75px; }
}
@media(prefers-reduced-motion:reduce) {
  #intro *, #intro *::before, #intro *::after {
    animation-duration: .01ms !important;
    animation-delay: 0ms !important;
  }
}
</style>

<section id="intro">
  <div class="night-glow"></div>
  <div class="moon"></div>

  <div class="snow-layer" id="introSnow"></div>

  <div class="intro-content">
    <div class="welcome">
      <div class="brand">MANHWA LAND</div>
      <div class="subtitle" id="hanaSubtitle">
        به مانهوا لند خوش اومدید!
      </div>
      <button class="palace-button" onclick="enterPalace()">
        ✧ به قصر وارد شوید ✧
      </button>
    </div>

    <div class="hana-frame">
      <video id="hanaVideo" autoplay muted playsinline>
        <source src="hana-intro.mp4" type="video/mp4">
      </video>
    </div>
  </div>

  <button class="skip-intro" onclick="enterPalace()">
    رد کردن مقدمه
  </button>
</section>

<script>
/* برف ابتدا کم و سپس آرام‌آرام بیشتر می‌شود */
(function createIntroSnow() {
  const layer = document.getElementById("introSnow");
  if (!layer) return;

  const total = 65;

  for (let i = 0; i < total; i++) {
    const flake = document.createElement("span");
    const size = Math.random() * 4 + 1;
    const duration = Math.random() * 9 + 9;
    const delay = Math.random() * 8;

    Object.assign(flake.style, {
      position: "absolute",
      left: Math.random() * 100 + "%",
      top: "-12px",
      width: size + "px",
      height: size + "px",
      borderRadius: "50%",
      background: i % 3 === 0 ? "#b9e9ff" : "#ffffff",
      opacity: "0",
      boxShadow: "0 0 8px #b9e9ff88",
      animation: `slowSnow ${duration}s ${delay}s linear infinite`
    });

    layer.appendChild(flake);
  }

  const snowStyle = document.createElement("style");
  snowStyle.textContent = `
    @keyframes slowSnow {
      0% { transform: translate3d(0,-5vh,0); opacity:0; }
      12% { opacity:.65; }
      85% { opacity:.55; }
      100% { transform: translate3d(35px,110vh,0); opacity:0; }
    }
  `;
  document.head.appendChild(snowStyle);
})();

/* ورود به قصر و رفتن به صفحه اصلی */
function enterPalace() {
  const intro = document.getElementById("intro");
  const video = document.getElementById("hanaVideo");

  if (video) video.pause();
  intro.classList.add("leaving");

  window.setTimeout(() => {
    intro.style.display = "none";
    if (typeof showPage === "function") showPage("home");
  }, 1800);
}

/* تلاش برای شروع خودکار ویدیو؛ در صورت محدودیت مرورگر، کاربر می‌تواند پخش کند. */
window.addEventListener("load", () => {
  const video = document.getElementById("hanaVideo");
  if (video) video.play().catch(() => {});
});
</script>
