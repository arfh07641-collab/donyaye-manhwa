







<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مانهوا لند</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:#071426;
  color:#f2faff;
}
#intro{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  overflow:hidden;
  position:relative;
  background:radial-gradient(ellipse,#193d60,#071426 70%);
  padding:20px;
}
.snow{
  position:absolute;
  top:-15px;
  width:4px;height:4px;
  background:white;border-radius:50%;
  box-shadow:0 0 8px #b8eaff;
  animation:fall linear infinite;
}
@keyframes fall{
  to{transform:translateY(110vh) translateX(30px)}
}
.content{position:relative;z-index:2}
h1{
  color:#c7efff;
  text-shadow:0 0 20px #55baff;
  font-size:clamp(27px,6vw,42px);
}
.portrait{
  width:240px;height:240px;
  max-width:65vw;max-height:65vw;
  margin:20px auto;
  border:3px solid #a9e6ff;
  border-radius:50%;
  box-shadow:0 0 35px #48b9f577;
  overflow:hidden;
  background:#102943;
}
.portrait img{
  width:100%;height:100%;
  object-fit:cover;
}
.bubble{
  position:relative;
  background:#f4fbff;
  color:#10243b;
  padding:18px 20px;
  border-radius:24px;
  font-size:clamp(17px,4vw,22px);
  font-weight:bold;
  margin:20px auto;
  max-width:420px;
  animation:appear 1s 1s both;
}
.bubble:after{
  content:"";
  position:absolute;
  top:-12px;right:calc(50% - 12px);
  border-width:0 12px 14px;
  border-style:solid;
  border-color:transparent transparent #f4fbff;
}
@keyframes appear{
  from{opacity:0;transform:translateY(15px)}
  to{opacity:1;transform:translateY(0)}
}
button{
  padding:14px 24px;
  border:1px solid #a9e6ff;
  border-radius:15px;
  background:linear-gradient(135deg,#c7f1ff,#61b9e8);
  color:#071426;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
#home{display:none;padding:25px;max-width:900px;margin:auto}
#home h2{color:#bcecff}
.card{
  margin-top:20px;padding:20px;
  background:#10243b;
  border:1px solid #294867;
  border-radius:18px;
}
</style>
</head>
<body>

<section id="intro">
  <div id="snow"></div>
  <div class="content">
    <h1>✧ MANHWA LAND ✧</h1>
    <p>قصر داستان‌هایی که در قلبت می‌مانند</p>

    <div class="portrait">
      <img src="hana-intro.png" alt="هانا"
      onerror="this.style.display='none';this.parentElement.innerHTML='<div style=&quot;padding:65px 15px;color:#c7efff;line-height:2&quot;>تصویر هانا<br>اینجا قرار می‌گیرد ❄️</div>'">
    </div>

    <div class="bubble">
      به مانهوا لند خوش اومدید! ❄️
    </div>

    <button onclick="enterCastle()">
      ✧ به قصر وارد شوید ✧
    </button>
  </div>
</section>

<main id="home">
  <h1>❄ مانهوا لند ❄</h1>
  <p>به دنیای جادویی مانهوا خوش اومدی!</p>

  <div class="card">
    <h2>📚 کتابخانه مانهوا</h2>
    <p>به‌زودی داستان‌های موردعلاقه‌ات اینجا قرار می‌گیرند.</p>
  </div>

  <div class="card">
    <h2>👑 حساب کاربری</h2>
    <p>بخش ورود و ثبت‌نام در مرحله بعد به سایت وصل می‌شود.</p>
  </div>
</main>

<script>
for(let i=0;i<65;i++){
  const s=document.createElement('span');
  s.className='snow';
  s.style.left=Math.random()*100+'%';
  s.style.animationDuration=(6+Math.random()*10)+'s';
  s.style.animationDelay=(-Math.random()*12)+'s';
  s.style.opacity=0.3+Math.random()*0.7;
  document.getElementById('snow').appendChild(s);
}

function enterCastle(){
  document.getElementById('intro').style.display='none';
  document.getElementById('home').style.display='block';
  window.scrollTo(0,0);
}
</script>
</body>
</html>
